=== docker-compose.yml ===
version: '3.8'

services:
  tour-management-app:
    image: tour-management-asp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tour-management-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DB_SERVER=${DB_SERVER:-your-database-server.com}
      - DB_NAME=${DB_NAME:-TourManagementDB}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-YourStrong@Password}
      - TZ=UTC
    volumes:
      - ./logs:/app/logs
      - ./appsettings-override:/app/appsettings-override:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tour-management-network

networks:
  tour-management-network:
    driver: bridge

volumes:
  logs:
  appsettings-override: