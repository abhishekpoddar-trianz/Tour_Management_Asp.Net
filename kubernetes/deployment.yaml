apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-management
  namespace: tour-management
  labels:
    app: tour-management
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tour-management
  template:
    metadata:
      labels:
        app: tour-management
        version: v1
    spec:
      containers:
      - name: tour-management
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: PORT
          value: "8080"
        - name: DB_SERVER
          value: "{{DB_SERVER}}"
        - name: DB_NAME
          value: "{{DB_NAME}}"
        - name: DB_USER
          value: "{{DB_USER}}"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tour-management-secrets
              key: db-password
              optional: true
        - name: CHART_TEMP_DIR
          value: "/tmp/charts"
        - name: UPLOAD_PATH
          value: "/app/uploads"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: charts
          mountPath: /tmp/charts
      volumes:
      - name: uploads
        emptyDir: {}
      - name: charts
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Secret
metadata:
  name: tour-management-secrets
  namespace: tour-management
type: Opaque
stringData:
  db-password: "{{DB_PASSWORD}}"